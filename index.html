<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suomi Flashcards</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #121820;
      --card-bg: #1e2631;
      --accent-cyan: #70d6ff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --btn-again: #ff6b6b;
      --btn-good: #51cf66;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent-cyan);
      margin-bottom: 6px;
    }

    .stats {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .card {
      width: 100%;
      height: 260px;
      background-color: var(--card-bg);
      border-radius: 16px;
      border: 1px solid rgba(112, 214, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 24px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent-cyan);
    }

    .word-finnish {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .word-english {
      font-size: 1.4rem;
      color: var(--accent-cyan);
      margin-top: 16px;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }

    .card.revealed .word-english {
      visibility: visible;
      opacity: 1;
    }

    .hint {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
      visibility: hidden;
    }

    .actions.visible {
      visibility: visible;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    .btn-again {
      background-color: var(--btn-again);
      color: #fff;
    }

    .btn-good {
      background-color: var(--btn-good);
      color: #121820;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Suomi Flashcards</h1>
      <div class="stats" id="stats">Loading reviews...</div>
    </header>

    <div class="card" id="card" onclick="revealCard()">
      <div class="word-finnish" id="finnish-text">...</div>
      <div class="word-english" id="english-text">...</div>
      <div class="hint" id="hint">Tap card to show translation</div>
    </div>

    <div class="actions" id="actions">
      <button class="btn-again" onclick="rateWord(false)">Again (1d)</button>
      <button class="btn-good" onclick="rateWord(true)">Good</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://jlftmijsrquakutrbuff.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsZnRtaWpzcnF1YWt1dHJidWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MjU2NTAsImV4cCI6MjEwNTIwMTY1MH0.yWs2y0vsmMNvMBs-Ot_cjpTAkp-qqVnsnA0Ea2mRqU8";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let queue = [];
    let currentItem = null;

    async function init() {
      // 1. Sync vocabulary from words.json to Supabase if empty
      const { data: existingWords } = await db.from('words').select('id').limit(1);
      if (!existingWords || existingWords.length === 0) {
        document.getElementById('stats').innerText = "Uploading word list...";
        const res = await fetch('words.json');
        const rawJson = await res.json();

        // Maps "word" -> "finnish" and "definition" -> "english"
        const formattedData = rawJson.map(item => ({
          finnish: item.word,
          english: item.definition
        }));

        // Upload in chunks of 500
        for (let i = 0; i < formattedData.length; i += 500) {
          const chunk = formattedData.slice(i, i + 500);
          await db.from('words').insert(chunk);
        }
      }

      // 2. Fetch words due for review or not yet studied
      const { data, error } = await db
        .from('words')
        .select(`
          id, finnish, english,
          user_progress ( interval, repetition, ease_factor, next_review )
        `);

      if (error) {
        console.error("Error fetching words:", error);
        document.getElementById('stats').innerText = "Error loading words";
        return;
      }

      // Filter items due today or brand new
      queue = data.filter(item => {
        const prog = Array.isArray(item.user_progress) && item.user_progress.length > 0 
            ? item.user_progress[0] 
            : item.user_progress;

        if (!prog) return true; // Brand new word
        return new Date(prog.next_review) <= new Date();
        });

      document.getElementById('stats').innerText = `${queue.length} words due today`;
      nextCard();
    }

    function nextCard() {
      if (queue.length === 0) {
        document.getElementById('finnish-text').innerText = "All done! 🎉";
        document.getElementById('english-text').innerText = "No more reviews due right now.";
        document.getElementById('hint').innerText = "";
        document.getElementById('card').classList.add('revealed');
        document.getElementById('actions').classList.remove('visible');
        return;
      }

      currentItem = queue[0];
      document.getElementById('finnish-text').innerText = currentItem.finnish;
      document.getElementById('english-text').innerText = currentItem.english;
      document.getElementById('hint').innerText = "Tap card to show translation";
      document.getElementById('card').classList.remove('revealed');
      document.getElementById('actions').classList.remove('visible');
    }

    function revealCard() {
      if (!currentItem) return;
      document.getElementById('card').classList.add('revealed');
      document.getElementById('actions').classList.add('visible');
    }

    async function rateWord(isGood) {
      if (!currentItem) return;

      const prog = (Array.isArray(currentItem.user_progress) && currentItem.user_progress.length > 0)
        ? currentItem.user_progress[0] 
        : (currentItem.user_progress || { interval: 1, repetition: 0, ease_factor: 2.5 });

      let { interval, repetition, ease_factor } = prog;

      if (!isGood) {
        repetition = 0;
        interval = 1;
      } else {
        repetition += 1;
        if (repetition === 1) interval = 1;
        else if (repetition === 2) interval = 3;
        else interval = Math.round(interval * ease_factor);
      }

      const nextReview = new Date();
      nextReview.setDate(nextReview.getDate() + interval);

      // Save update to Supabase
      await db.from('user_progress').upsert({
        word_id: currentItem.id,
        interval: interval,
        repetition: repetition,
        ease_factor: ease_factor,
        next_review: nextReview.toISOString()
      }, { onConflict: 'word_id' });

      // Move to next word
      queue.shift();
      document.getElementById('stats').innerText = `${queue.length} words remaining`;
      nextCard();
    }

    init();
  </script>
</body>
</html>
