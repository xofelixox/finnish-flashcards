<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suomi Flashcards</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #121820;
      --card-bg: #1e2631;
      --accent-cyan: #70d6ff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --btn-again: #ff6b6b;
      --btn-good: #51cf66;
      --progress-bg: #2d3748;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    header {
      text-align: center;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent-cyan);
      margin-bottom: 8px;
    }

    .stats {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Progress Tracker Styles */
    .progress-container {
      width: 100%;
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(112, 214, 255, 0.1);
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: var(--progress-bg);
      border-radius: 5px;
      overflow: hidden;
      display: flex;
      margin-bottom: 8px;
    }

    .progress-fill-mastered {
      height: 100%;
      background-color: var(--btn-good);
      transition: width 0.3s;
    }

    .progress-fill-learning {
      height: 100%;
      background-color: var(--accent-cyan);
      transition: width 0.3s;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card {
      width: 100%;
      height: 250px;
      background-color: var(--card-bg);
      border-radius: 16px;
      border: 1px solid rgba(112, 214, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 24px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent-cyan);
    }

    .word-finnish {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .word-english {
      font-size: 1.4rem;
      color: var(--accent-cyan);
      margin-top: 16px;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }

    .card.revealed .word-english {
      visibility: visible;
      opacity: 1;
    }

    .hint {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
      visibility: hidden;
    }

    .actions.visible {
      visibility: visible;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    .btn-again {
      background-color: var(--btn-again);
      color: #fff;
    }

    .btn-good {
      background-color: var(--btn-good);
      color: #121820;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Suomi Flashcards</h1>
      <div class="stats" id="stats">Loading reviews...</div>
      
      <!-- Progress Bar Tracker -->
      <div class="progress-container">
        <div class="progress-bar-bg">
          <div class="progress-fill-mastered" id="bar-mastered" style="width: 0%"></div>
          <div class="progress-fill-learning" id="bar-learning" style="width: 0%"></div>
        </div>
        <div class="progress-labels">
          <span id="label-mastered">Mastered: 0</span>
          <span id="label-learning">Learning: 0</span>
          <span id="label-new">New: 0</span>
        </div>
      </div>
    </header>

    <div class="card" id="card" onclick="revealCard()">
      <div class="word-finnish" id="finnish-text">...</div>
      <div class="word-english" id="english-text">...</div>
      <div class="hint" id="hint">Tap card to show translation</div>
    </div>

    <div class="actions" id="actions">
      <button class="btn-again" onclick="rateWord(false)">Again (1d)</button>
      <button class="btn-good" onclick="rateWord(true)">Good</button>
    </div>
  </div>

  <script>
    // Config: Replace these with your Supabase keys
    const SUPABASE_URL = "https://jlftmijsrquakutrbuff.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsZnRtaWpzcnF1YWt1dHJidWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MjU2NTAsImV4cCI6MjEwNTIwMTY1MH0.yWs2y0vsmMNvMBs-Ot_cjpTAkp-qqVnsnA0Ea2mRqU8";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Limit settings
    const DAILY_NEW_LIMIT = 20;

    let queue = [];
    let currentItem = null;

    async function init() {
      // 1. Sync vocabulary from words.json to Supabase if empty
      const { data: existingWords } = await db.from('words').select('id').limit(1);
      if (!existingWords || existingWords.length === 0) {
        document.getElementById('stats').innerText = "Uploading word list...";
        const res = await fetch('words.json');
        const rawJson = await res.json();

        const formattedData = rawJson.map(item => ({
          finnish: item.word,
          english: item.definition
        }));

        for (let i = 0; i < formattedData.length; i += 500) {
          const chunk = formattedData.slice(i, i + 500);
          await db.from('words').insert(chunk);
        }
      }

      // 2. Fetch all words with progress
      const { data, error } = await db
        .from('words')
        .select(`
          id, finnish, english,
          user_progress ( interval, repetition, ease_factor, next_review )
        `);

      if (error) {
        console.error("Error fetching words:", error);
        document.getElementById('stats').innerText = "Error loading words";
        return;
      }

      // 3. Categorize words
      const reviewsDue = [];
      const newWords = [];
      let countMastered = 0;
      let countLearning = 0;
      let countNew = 0;

      const now = new Date();

      data.forEach(item => {
        const prog = (Array.isArray(item.user_progress) && item.user_progress.length > 0)
          ? item.user_progress[0]
          : item.user_progress;

        if (!prog) {
          countNew++;
          newWords.push(item);
        } else {
          if (prog.interval > 21) {
            countMastered++;
          } else {
            countLearning++;
          }

          if (new Date(prog.next_review) <= now) {
            reviewsDue.push(item);
          }
        }
      });

      // Update progress bar UI
      const totalWords = data.length || 1;
      document.getElementById('bar-mastered').style.width = `${(countMastered / totalWords) * 100}%`;
      document.getElementById('bar-learning').style.width = `${(countLearning / totalWords) * 100}%`;
      
      document.getElementById('label-mastered').innerText = `Mastered: ${countMastered}`;
      document.getElementById('label-learning').innerText = `Learning: ${countLearning}`;
      document.getElementById('label-new').innerText = `New: ${countNew}`;

      // Build daily queue: all due reviews + capped new words
      const cappedNewWords = newWords.slice(0, DAILY_NEW_LIMIT);
      queue = [...reviewsDue, ...cappedNewWords];

      document.getElementById('stats').innerText = `${reviewsDue.length} reviews + ${cappedNewWords.length} new words today`;
      nextCard();
    }

    function nextCard() {
      if (queue.length === 0) {
        document.getElementById('finnish-text').innerText = "All done! 🎉";
        document.getElementById('english-text').innerText = "No more reviews due right now.";
        document.getElementById('hint').innerText = "";
        document.getElementById('card').classList.add('revealed');
        document.getElementById('actions').classList.remove('visible');
        return;
      }

      currentItem = queue[0];
      document.getElementById('finnish-text').innerText = currentItem.finnish;
      document.getElementById('english-text').innerText = currentItem.english;
      document.getElementById('hint').innerText = "Tap card to show translation";
      document.getElementById('card').classList.remove('revealed');
      document.getElementById('actions').classList.remove('visible');
    }

    function revealCard() {
      if (!currentItem) return;
      document.getElementById('card').classList.add('revealed');
      document.getElementById('actions').classList.add('visible');
    }

    async function rateWord(isGood) {
      if (!currentItem) return;

      const prog = (Array.isArray(currentItem.user_progress) && currentItem.user_progress.length > 0)
        ? currentItem.user_progress[0]
        : (currentItem.user_progress || { interval: 1, repetition: 0, ease_factor: 2.5 });

      let interval = prog.interval || 1;
      let repetition = prog.repetition || 0;
      let ease_factor = prog.ease_factor || 2.5;

      if (!isGood) {
        repetition = 0;
        interval = 1;
      } else {
        repetition += 1;
        if (repetition === 1) interval = 1;
        else if (repetition === 2) interval = 3;
        else interval = Math.round(interval * ease_factor);
      }

      const nextReview = new Date();
      nextReview.setDate(nextReview.getDate() + interval);

      await db.from('user_progress').upsert({
        word_id: currentItem.id,
        interval: interval,
        repetition: repetition,
        ease_factor: ease_factor,
        next_review: nextReview.toISOString()
      }, { onConflict: 'word_id' });

      queue.shift();
      document.getElementById('stats').innerText = `${queue.length} words remaining today`;
      nextCard();
    }

    init();
  </script>
</body>
</html>
